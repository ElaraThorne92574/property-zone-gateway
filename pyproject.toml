[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "property-zone-gateway"
version = "0.1.0"
description = "Route property operations through DNS records managed by one gateway."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/property_dns_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
